<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#080c14"/>

  <!-- Glow -->
  <ellipse cx="12" cy="20" rx="9" ry="8" fill="#f97316" opacity="0.15"/>

  <!-- Pump body -->
  <rect x="4" y="10" width="14" height="16" rx="2.5" fill="#f97316"/>

  <!-- Display window -->
  <rect x="6.5" y="13" width="9" height="6" rx="1.5" fill="#0d1220"/>

  <!-- Fuel drop on display -->
  <path d="M11 14.5 C11 14.5 9.2 16.5 9.2 17.8
           C9.2 18.9 10 19.5 11 19.5
           C12 19.5 12.8 18.9 12.8 17.8
           C12.8 16.5 11 14.5 11 14.5Z"
        fill="#fbbf24"/>

  <!-- Hose arm -->
  <path d="M18 14 L23 14 L23 20.5"
        stroke="#fb923c" stroke-width="2.2"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nozzle -->
  <rect x="21" y="20.5" width="5" height="2.8" rx="1.4" fill="#fb923c"/>

  <!-- Base -->
  <rect x="3" y="26" width="16" height="2.5" rx="1.2" fill="#c2410c"/>
</svg>
