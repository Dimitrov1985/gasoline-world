name: Update Fuel News

on:
  schedule:
    - cron: '0 7 * * *'   # каждый день в 7:00 UTC
  workflow_dispatch:        # ручной запуск из вкладки Actions на GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch latest news
        env:
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
        run: node scripts/update-news.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news-live.json
          if git diff --cached --quiet; then
            echo "ℹ No news changes — skipping commit"
          else
            git commit -m "chore: update fuel news $(date +%Y-%m-%d)"
            git push
            echo "✅ Pushed — Vercel will auto-deploy"
          fi
