name: Update Fuel Prices

on:
  schedule:
    - cron: '0 6 * * *'   # каждый день в 6:00 UTC
  workflow_dispatch:        # ручной запуск из вкладки Actions на GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape prices
        run: node scripts/update-prices.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/prices.json
          if git diff --cached --quiet; then
            echo "ℹ No price changes — skipping commit"
          else
            git commit -m "chore: update fuel prices $(date +%Y-%m-%d)"
            git push
            echo "✅ Pushed — Vercel will auto-deploy"
          fi
